<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250" role="img" aria-label="Crinaro">
  <title>Crinaro.AI — animated</title>
  <rect width="620" height="250" fill="#0B2545"/>
  <style>
    .cand { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
            animation: draw 1.1s ease-out forwards, dim 0.8s 1.5s ease-out forwards; }
    .cand:nth-of-type(2) { animation-delay: 0.12s, 1.5s; }
    .cand:nth-of-type(3) { animation-delay: 0.24s, 1.5s; }
    .solved { stroke-dasharray: 1; stroke-dashoffset: 1;
              animation: draw 1.4s 1.2s cubic-bezier(.4,0,.2,1) forwards; }
    .node { opacity: 0; transform-box: fill-box; transform-origin: center;
            animation: pop 0.45s cubic-bezier(.2,1.4,.4,1) forwards; }
    .n1 { animation-delay: 1.75s } .n2 { animation-delay: 1.9s }
    .n3 { animation-delay: 2.15s } .n4 { animation-delay: 2.35s }
    .n5 { animation-delay: 2.5s }
    @keyframes draw { to { stroke-dashoffset: 0; opacity: 1 } }
    @keyframes dim  { to { opacity: 0.28 } }
    @keyframes pop  { from { transform: scale(0.4) } to { opacity: 1; transform: scale(1) } }
    @media (prefers-reduced-motion: reduce) {
      .cand { animation: none; opacity: 0.28; stroke-dashoffset: 0 }
      .solved { animation: none; stroke-dashoffset: 0 }
      .node { animation: none; opacity: 1 }
    }
  </style>
  <path class="cand" pathLength="1" d="M52 132 L138 132 L176 104 L214 112 L262 62 L288 74 L320 38 L358 88 L404 72 L452 118 L502 132 L568 132" fill="none" stroke="#93B8D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="cand" pathLength="1" d="M52 132 L162 132 L200 74 L240 92 L278 56 L320 38 L364 96 L398 66 L438 108 L478 132 L568 132" fill="none" stroke="#93B8D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="cand" pathLength="1" d="M52 132 L144 132 L192 90 L232 66 L276 102 L320 38 L370 74 L410 100 L448 82 L480 132 L568 132" fill="none" stroke="#93B8D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="solved" pathLength="1" d="M52 132 L150 132 L212 86 L252 104 L320 38 L376 106 L416 84 L466 132 L568 132" fill="none" stroke="#4FA98A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="node n1" cx="212" cy="86" r="7" fill="#F2F6F8" stroke="#0B2545" stroke-width="3.5"/>
  <circle class="node n2" cx="252" cy="104" r="7" fill="#F2F6F8" stroke="#0B2545" stroke-width="3.5"/>
  <circle class="node n3" cx="320" cy="38" r="10.5" fill="#F2F6F8" stroke="#0B2545" stroke-width="3.5"/>
  <circle class="node n4" cx="376" cy="106" r="7" fill="#F2F6F8" stroke="#0B2545" stroke-width="3.5"/>
  <circle class="node n5" cx="416" cy="84" r="7" fill="#F2F6F8" stroke="#0B2545" stroke-width="3.5"/>
  <text x="310.0" y="212" text-anchor="middle" fill="#F2F6F8" font-family="Futura, 'Century Gothic', 'Avenir Next', Avenir, sans-serif" font-size="52" font-weight="500" letter-spacing="0.26em" dx="0 0 0 0 0 0 0 -6.76 -6.76 0">CRINARO<tspan fill="#4FA98A">.AI</tspan></text>
</svg>
